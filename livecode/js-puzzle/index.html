<!DOCTYPE html>
<html>
<head>
  <title>LiveCode - JS puzzle</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="data:image/x-icon;" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <link rel="stylesheet" href="application.css">
</head>
<body>
  <h1 class="text center my-5">JS puzzle 🧩</h1>
  <table>
    <tr>
      <td>1</td>
      <td>2</td>
      <td>3</td>
      <td>4</td>
    </tr>
    <tr>
      <td>5</td>
      <td>6</td>
      <td>7</td>
      <td>8</td>
    </tr>
    <tr> <!-- row index 2 -->
      <td>9</td> <!-- cell index 0 -->
      <td>10</td> <!-- cell index 1 etc -->
      <td>11</td>
      <td>12</td>
    </tr>
    <tr>
      <td>13</td>
      <td>14</td>
      <td class="empty"></td>
      <td>15</td>
    </tr>
  </table>

  <button id="show-hint" class=" mt-2 btn btn-primary">Give me a hint</button>

  <div class="hint d-none">
    <p>
      Reorder the tiles by ascending order. Good luck!
    </p>
  </div>

  <script type="module" src="lib/puzzle.js"></script>
</body>
</html>
