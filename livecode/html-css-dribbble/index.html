<html>
  <head>
    <title>Dribbble card</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="container">
      <h1 class="text-center">Dribbble card design</h1>
      <div class="cards">
        <div class="card-container">
          <div class="card-white">
            <div class="card-white-image" style="background-image: url('images/image1.jpg');">
              <a href="#" class="btn">Save</a>
            </div>
            <ul class="list-inline">
              <li><i class="fas fa-eye"></i> 90</li>
              <li><i class="fas fa-comment"></i> 10</li>
              <li><i class="fas fa-heart"></i> 24</li>
            </ul>
          </div>
          <div class="card-user">
            <img src="images/avatar.jpg" alt="arthur-littm" class="avatar"><a href="alt">Mr What's His Name</a>
          </div>
        </div>
        <div class="card-container">
          <div class="card-white">
            <div class="card-white-image" style="background-image: url('images/image2.jpg');">
              <a href="#" class="btn">Save</a>
            </div>

              <li><i class="fas fa-comment"></i> 10</li>

            </ul>
          </div>
          <div class="card-user">
            <img src="images/avatar.jpg" alt="arthur-littm" class="avatar"><a href="alt">Mr What's His Name</a>
          </div>
        </div>
        <div class="card-container">
          <div class="card-white">
            <div class="card-white-image" style="background-image: url('images/image3.jpg');">
              <a href="#" class="btn">Save</a>
            </div>
            <ul class="list-inline">
              <li><i class="fas fa-eye"></i> 90</li>
              <li><i class="fas fa-comment"></i> 10</li>
              <li><i class="fas fa-heart"></i> 24</li>
            </ul>
          </div>
          <div class="card-user">
            <img src="images/avatar.jpg" alt="arthur-littm" class="avatar"><a href="alt">Mr What's His Name</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
